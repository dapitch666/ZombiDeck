name: Tag Release

on:
  pull_request:
    types: [ closed ]
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  tag:
    if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'release/')
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}

    steps:
      - name: Checkout merge commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Read app version
        id: app_version
        run: |
          VERSION_NAME="$(grep '^VERSION_NAME=' version.properties | cut -d'=' -f2)"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"

      - name: Guard against duplicate tag
        run: |
          TAG="v${{ steps.app_version.outputs.version_name }}"
          if git ls-remote --exit-code --tags origin "$TAG" > /dev/null 2>&1; then
            echo "::error::Tag $TAG already exists. Aborting to prevent duplicate release."
            exit 1
          fi

      - name: Create and push tag
        id: tag
        run: |
          TAG="v${{ steps.app_version.outputs.version_name }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  release-apk:
    needs: tag
    uses: ./.github/workflows/release_apk.yaml
    with:
      ref: ${{ needs.tag.outputs.tag }}
    secrets: inherit
